name: IOSYunKongBase
options:
  bundleIdPrefix: cn.iosmirror
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_BITCODE: NO
    CLANG_ENABLE_MODULES: YES
targets:
  IOSYunKongBase:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.iosmirror.base
        PRODUCT_NAME: IOSYunKongBase
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.2.6"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: App/IOSYunKongBase-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/App/Vendor/STHID"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "IOKit"
          - "-framework"
          - "IOSurface"
          - "-framework"
          - "QuartzCore"
          - "-framework"
          - "UIKit"
        CLANG_ENABLE_OBJC_ARC: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    dependencies:
      - target: Broadcast
        embed: true
        codeSign: false
    entitlements:
      path: App/App.entitlements
    scheme:
      testTargets: []

  Broadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.iosmirror.base.Broadcast
        PRODUCT_NAME: Broadcast
        INFOPLIST_FILE: Extension/Info.plist
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        SKIP_INSTALL: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.2.6"
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
    entitlements:
      path: Extension/Extension.entitlements
