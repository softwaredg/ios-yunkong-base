# PHB1 PhoneBaseLocal (from 投屏解包). Pack scripts still emit IOSYunKongBase.app.
name: IOSYunKongBase
options:
  bundleIdPrefix: cn.iosmirror
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_BITCODE: NO
    CLANG_ENABLE_MODULES: YES
targets:
  IOSYunKongBase:
    type: application
    platform: iOS
    sources:
      - path: PhoneBaseLocal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.iosmirror.base
        PRODUCT_NAME: IOSYunKongBase
        INFOPLIST_FILE: PhoneBaseLocal/Info.plist
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.2.46"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "IOKit"
          - "-framework"
          - "IOSurface"
          - "-framework"
          - "QuartzCore"
          - "-framework"
          - "UIKit"
          - "-framework"
          - "VideoToolbox"
          - "-framework"
          - "CoreMedia"
          - "-framework"
          - "CoreVideo"
          - "-framework"
          - "AVFoundation"
        CLANG_ENABLE_OBJC_ARC: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        CODE_SIGN_ENTITLEMENTS: signing/App.entitlements
    dependencies:
      - sdk: IOSurface.framework
      - sdk: VideoToolbox.framework
      - sdk: QuartzCore.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: CoreFoundation.framework
      - sdk: UIKit.framework
      - sdk: AVFoundation.framework
    scheme:
      testTargets: []
