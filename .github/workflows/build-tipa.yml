name: Build tipa

on:
  workflow_dispatch:
    inputs:
      version:
        description: "version e.g. 0.2.1"
        required: false
        default: "0.2.1"
  push:
    branches: [main]
    paths:
      - "手机基座源码/**"
      - ".github/workflows/build-tipa.yml"

permissions:
  contents: write

jobs:
  tipa:
    name: macOS tipa
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version
        id: ver
        run: |
          V="${{ github.event.inputs.version }}"
          if [[ -z "$V" ]]; then V="0.2.1"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building version $V"

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Generate Xcode project
        working-directory: 手机基座源码
        run: xcodegen generate

      - name: Build unsigned
        working-directory: 手机基座源码
        run: |
          set -euo pipefail
          xcodebuild \
            -project IOSYunKongBase.xcodeproj \
            -scheme IOSYunKongBase \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Pack tipa
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          DERIVED_DATA: ${{ github.workspace }}/手机基座源码/build
        run: |
          chmod +x 手机基座源码/scripts/pack-tipa.sh
          手机基座源码/scripts/pack-tipa.sh "${{ github.workspace }}/手机基座"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IOSYunKongBase-${{ steps.ver.outputs.version }}-tipa
          path: 手机基座/*.tipa
          if-no-files-found: error

      - name: GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          TAG="tipa-v${VERSION}"
          TIPA=$(ls 手机基座/*.tipa | head -n1)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$TIPA" --clobber
          else
            gh release create "$TAG" "$TIPA" --title "$TAG" --notes "TVH4 + IOHID tipa · auto-start · memory restart"
          fi