name: Build tipa

on:
  workflow_dispatch:
    inputs:
      version:
        description: "optional fixed version (skip auto +1); leave empty to bump patch"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "手机基座源码/**"
      - ".github/workflows/build-tipa.yml"

permissions:
  contents: write

jobs:
  tipa:
    name: macOS tipa
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Generate Xcode project
        working-directory: 手机基座源码
        run: xcodegen generate

      - name: Build unsigned
        working-directory: 手机基座源码
        run: |
          set -euo pipefail
          xcodebuild \
            -project IOSYunKongBase.xcodeproj \
            -scheme IOSYunKongBase \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Pack tipa
        id: pack
        env:
          DERIVED_DATA: ${{ github.workspace }}/手机基座源码/build
        run: |
          set -euo pipefail
          chmod +x 手机基座源码/scripts/pack-tipa.sh
          INPUT="${{ github.event.inputs.version }}"
          if [[ -n "${INPUT}" ]]; then
            export VERSION="$INPUT"
            export BUMP=0
          else
            unset VERSION || true
            export BUMP=1
          fi
          手机基座源码/scripts/pack-tipa.sh "${{ github.workspace }}/手机基座"
          echo "packed $(tr -d '[:space:]' < 手机基座源码/VERSION)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IOSYunKongBase-${{ steps.pack.outputs.version }}-tipa
          path: 手机基座/*.tipa
          if-no-files-found: error

      - name: Commit version bump
        run: |
          set -euo pipefail
          V="${{ steps.pack.outputs.version }}"
          git add 手机基座源码/VERSION 手机基座源码/project.yml || true
          if git diff --cached --quiet; then
            echo "no version file changes"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore: tipa ${V} [skip ci]"
          git push origin HEAD:main

      - name: GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.pack.outputs.version }}
        run: |
          set -euo pipefail
          TAG="tipa-v${VERSION}"
          TIPA=$(ls 手机基座/*.tipa | head -n1)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$TIPA" --clobber
          else
            gh release create "$TAG" "$TIPA" --title "$TAG" --notes "TVH4 + IOHID tipa ${VERSION}"
          fi
