name: Build tipa

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 0.1.0）"
        required: false
        default: "0.1.0"
      create_release:
        description: "上传到 GitHub Release"
        type: boolean
        required: false
        default: true
  push:
    tags:
      - "tipa-v*"

permissions:
  contents: write

jobs:
  tipa:
    name: macOS build tipa
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Version
        id: ver
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            V="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            V="${GITHUB_REF_NAME#tipa-v}"
          else
            V="0.1.0"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Generate Xcode project
        working-directory: 手机基座源码
        run: xcodegen generate

      - name: Build (unsigned iphoneos)
        working-directory: 手机基座源码
        run: |
          set -euo pipefail
          xcodebuild \
            -project IOSYunKongBase.xcodeproj \
            -scheme IOSYunKongBase \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Pack tipa
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          DERIVED_DATA: ${{ github.workspace }}/手机基座源码/build
        run: |
          chmod +x 手机基座源码/scripts/pack-tipa.sh
          手机基座源码/scripts/pack-tipa.sh "${{ github.workspace }}/手机基座"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IOSYunKongBase-${{ steps.ver.outputs.version }}-tipa
          path: 手机基座/*.tipa
          if-no-files-found: error

      - name: Create / update GitHub Release
        if: ${{ github.event_name == 'push' || github.event.inputs.create_release == 'true' || github.event.inputs.create_release == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          TAG="tipa-v${VERSION}"
          TIPA=$(ls 手机基座/*.tipa | head -n1)
          NOTES="IOS 云控基座 tipa（TrollStore）
- 画面：TVH4 TCP :5909
- 控制：phonebase-control → 开源 IOHID（点击/手势/按键/音量/电源等；需巨魔私有权限）
- 控制 HTTP：:11019 /control"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$TIPA" --clobber
          else
            gh release create "$TAG" "$TIPA" --title "$TAG" --notes "$NOTES"
          fi
